services:
  enterprise-architect:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: .
    image: enterprise-architect-wine:local
    container_name: enterprise-architect
    shm_size: "1gb"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - enterprise-architect-wine:/home/ea/.wine
      - ./projects:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/projects
      - ./input:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/input
      - ./output:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/output
    environment:
      SCREEN_RESOLUTION: "1600x900x24"

volumes:
  enterprise-architect-wine:
