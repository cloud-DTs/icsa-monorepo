services:
  enterprise-architect:
    profiles:
      - pipeline
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../enterprise-architect
      dockerfile: Dockerfile
    container_name: enterprise-architect
    shm_size: "1gb"
    ports:
      - "0.0.0.0:6080:6080"
    volumes:
      - enterprise-architect-wine:/home/ea/.wine
      - ./pipeline/enterprise-architect/projects:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/projects
      - ./pipeline/enterprise-architect/input:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/input
      - ./pipeline/enterprise-architect/output:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/output
    environment:
      SCREEN_RESOLUTION: "1600x900x24"

  fed-sysml:
    profiles:
      - pipeline
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../fed-sysml
      dockerfile: Dockerfile
    container_name: fed-sysml
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
      TF_IN_AUTOMATION: "${TF_IN_AUTOMATION:-true}"
    volumes:
      - ./pipeline/fed-sysml/input:/pipeline/input
      - ./pipeline/fed-sysml/output:/pipeline/output
      - type: bind
        source: ${FED_SYSML_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
        read_only: true

  digital-twin-profile-sysml-v1:
    profiles:
      - pipeline
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../sysml-v1-adapter
      dockerfile: Dockerfile
    container_name: digital-twin-profile-sysml-v1
    environment:
      DTP_PATH_MAP: "${DTP_PATH_MAP:-}"
    volumes:
      - ./pipeline/digital-twin-profile-sysml-v1/input:/pipeline/input
      - ./pipeline/digital-twin-profile-sysml-v1/output:/pipeline/output
      - type: bind
        source: ${PIPELINE_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
        read_only: true

  digital-twin-profile-sysml-v2:
    profiles:
      - pipeline
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../sysml-v2-adapter
      dockerfile: Dockerfile
      secrets:
        - gh_token
    container_name: digital-twin-profile-sysml-v2
    environment:
      DTP_PATH_MAP: "${DTP_PATH_MAP:-}"
    volumes:
      - type: bind
        source: ${DTP_V2_INPUT_HOST_DIR:-./pipeline/digital-twin-profile-sysml-v2/input}
        target: /pipeline/input
      - ./pipeline/digital-twin-profile-sysml-v2/output:/pipeline/output
      - type: bind
        source: ${PIPELINE_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
        read_only: true

  digital-twin-manager:
    profiles:
      - pipeline
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../digital-twin-manager
      dockerfile: Dockerfile
    container_name: digital-twin-manager
    stdin_open: true
    tty: true
    environment:
      DIGITAL_TWIN_MANAGER_CONFIG_DIR: "/pipeline/input"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
      DEPLOY_MANAGED_GRAFANA: "${DEPLOY_MANAGED_GRAFANA:-}"
      DEBUG: "${DT_DEBUG_MODE:-False}"
    volumes:
      - ./pipeline/digital-twin-manager/input:/pipeline/input
      - ./pipeline/digital-twin-manager/output:/pipeline/output
      - type: bind
        source: ${PIPELINE_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
  cloud-deployer-test-simulator:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../digital-twin-simulator
      dockerfile: Dockerfile
    profiles:
      - simulator
    environment:
      SIMULATOR_MOCK_AWS: "${SIMULATOR_MOCK_AWS:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
    volumes:
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./pipeline/digital-twin-manager/input}/config.json
        target: /app/config.json
        read_only: true
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./pipeline/digital-twin-manager/input}/config_hierarchy.json
        target: /app/config_hierarchy.json
        read_only: true
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./pipeline/digital-twin-manager/input}/config_iot_devices.json
        target: /app/config_iot_devices.json
        read_only: true
    ports:
      - "0.0.0.0:${SIMULATOR_HOST_PORT:-5000}:5000"

  digital-twin-evaluation:
    profiles:
      - evaluation
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ../digital-twin-evaluator
      dockerfile: Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-eu-west-1}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-1}"
    volumes:
      - type: bind
        source: ${EVALUATION_DEPLOYMENT_HOST_DIR:-./pipeline/digital-twin-manager/deployments/MGridICSA}
        target: /evaluation/deployment
        read_only: true
      - type: bind
        source: ${EVALUATION_CONFIG_HOST_FILE:-./pipeline/digital-twin-evaluation/input/MGridICSA.roundtrip.json}
        target: /evaluation/config.json
        read_only: true
      - type: bind
        source: ${EVALUATION_OUTPUT_HOST_DIR:-./pipeline/digital-twin-evaluation/output}
        target: /evaluation/results

  local-grafana:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    image: ${LOCAL_GRAFANA_IMAGE:-grafana/grafana:10.4.19}
    profiles:
      - grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${LOCAL_GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${LOCAL_GRAFANA_ADMIN_PASSWORD:-admin123}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "${LOCAL_GRAFANA_PLUGINS:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-eu-central-1}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-central-1}"
    ports:
      - "0.0.0.0:${LOCAL_GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./pipeline/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./pipeline/grafana/dashboards:/etc/grafana/dashboards:ro

secrets:
  gh_token:
    environment: GH_TOKEN

volumes:
  enterprise-architect-wine:
  grafana:
